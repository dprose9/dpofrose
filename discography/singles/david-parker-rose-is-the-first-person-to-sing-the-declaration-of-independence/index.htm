<!DOCTYPE html>
<html lang="en-US">
	<head>
		<link rel="stylesheet" href="/includes/format/dpofstyle.css">
		<script type="module" src="/includes/scripts/mdles.js" defer></script>
		<script type="module" src="/includes/scripts/loadpic.js" defer></script>
		<script type="module" src="/includes/scripts/albuminf.js" defer></script>
		<title>D. P. of Rose | David Parker Rose Is The First Person To Sing The Declaration Of Independence</title>
		
	</head>

	<body>
		<div>
			<div id="menuid"></div>
			
			<main class="album">
				<section class="cover" style="background-image: url(/includes/pics/albart/sngl/dpritfptstdoi/dpritfptstdoi-1000.png);">
					<div class="blur">
						<h2>David Parker Rose Is The First Person To Sing The Declaration Of Independence</h2>
						<img class="loadpic" src="/includes/pics/albart/sngl/dpritfptstdoi/dpritfptstdoi-0001.png" alt="💿" loading="lazy">
					</div>
				</section>
				<br>
				<br>
				<section>
					<h1 id="demo" style="text-align: center"></h1>

					<script>
						var countDownDate = new Date("Nov 27, 2026 00:00:00").getTime();

						var x = setInterval(function() {

							var now = new Date().getTime();

							var distance = countDownDate - now;

							var days = Math.floor(distance / (1000 * 60 * 60 * 24));
							var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
							var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
							var seconds = Math.floor((distance % (1000 * 60)) / 1000);
							
							var sec = "Seconds";
							var min = "Minutes";
							var hr = "Hours";
							var dy = "Days";
							var isare = "Are";
							
							if (seconds == 1) {
								sec = "Second";
							}
							
							if (minutes == 1) {
								min = "Minute";
							}
							
							if (hours == 1) {
								hr = "Hour";
							}
							
							if (days == 1) {
								dy = "Day";
								isare = "Is";
							}
							var timeleft = "There " + isare + " " + days + " " + dy + ", " + hours + " " + hr + ", "
							+ minutes + " " + min + ", & " + seconds + " " + sec + " Left!";
							
							var timetitle = days + ":" + hours + ":" + minutes + ":" + seconds
							
							document.getElementById("demo").innerHTML = timeleft;
							
							document.title = timetitle;

							if (distance < 0) {
								clearInterval(x);
								document.getElementById("demo").innerHTML = 
									`<section class="column">
										<div>
											<h3>David Parker Rose Is The First Person To Sing The Declaration Of Independence:</h3>
											<h4>
												Tracklist:<br>
												<br>
												01. <button type="button" onclick="trackFunc('01')">The Declaration Of Independence</button><br>
												02. <button type="button" onclick="trackFunc('02')">An Obligatory 60 Seconds Of Silence</button><br>
											</h4>
										</div>
										<div id="trksel">
											<h3>The Declaration Of Independence</h3>
											<h3>
												<button type="button" onclick="listenFunc('01')">Listen</button>
												<button type="button" onclick="creditsFunc('01')">Personel</button>
												<button type="button" onclick="lyricsFunc('01')">Lyrics</button>
											</h3>
											<div id="albinfo">
												<h4>Listen:</h4>
											</div>
										</div>
									</section>`;
								document.title = "D. P. of Rose | David Parker Rose Is The First Person To Sing The Declaration Of Independence";
							}
						}, 1000);
					</script>
				<section>
			</main>
		</div>
	</body>
	<div id="footerid"></div>
</html>
